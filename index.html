<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --sidebar-bg:#0B1220;
    --sidebar-bg-2:#121C33;
    --sidebar-text:#8AA0C7;
    --sidebar-text-active:#FFFFFF;
    --accent:#0E9488;
    --accent-2:#14B8A6;
    --accent-soft:#DFF6F2;
    --bg:#EEF2F6;
    --surface:#FFFFFF;
    --border:#E1E7EF;
    --text:#152238;
    --text-soft:#5B6B85;
    --text-faint:#94A3B8;
    --danger:#D6493B;
    --danger-soft:#FBE7E4;
    --warning:#C8790A;
    --warning-soft:#FBEED8;
    --success:#1A8A5E;
    --success-soft:#DFF3E9;
    --info:#2563C7;
    --info-soft:#E1EBFB;
    --gray-soft:#EEF1F5;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:20px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- App shell ---------- */
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:252px;flex-shrink:0;
    background:linear-gradient(180deg,var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:22px 20px 18px 20px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 14px -2px rgba(14,148,136,.55);
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand-text{line-height:1.15;}
  .brand-text .t1{color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px;}
  .brand-text .t2{color:#647episode;color:#6C81A8;font-size:11px;letter-spacing:1.5px;margin-top:2px;font-family:'JetBrains Mono',monospace;}

  .nav{flex:1;overflow-y:auto;padding:14px 12px;}
  .nav-group{margin-bottom:4px;}
  .nav-group-btn{
    width:100%;display:flex;align-items:center;gap:10px;
    background:none;border:none;color:var(--sidebar-text);
    padding:10px 10px;border-radius:8px;cursor:pointer;
    font-size:13.5px;font-weight:500;text-align:left;
    transition:background .15s,color .15s;
  }
  .nav-group-btn:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-group-btn .icon{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-group-btn .chev{margin-left:auto;width:13px;height:13px;transition:transform .18s;opacity:.6;}
  .nav-group.open .nav-group-btn .chev{transform:rotate(90deg);}
  .nav-group.open .nav-group-btn{color:#fff;}
  .nav-sub{
    max-height:0;overflow:hidden;transition:max-height .2s ease;
    display:flex;flex-direction:column;gap:1px;padding-left:14px;margin-top:2px;
  }
  .nav-group.open .nav-sub{max-height:400px;}
  .nav-item{
    display:flex;align-items:center;gap:9px;
    padding:8px 10px 8px 22px;border-radius:7px;cursor:pointer;
    color:var(--sidebar-text);font-size:13px;position:relative;
    border-left:2px solid transparent;
    transition:background .15s,color .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{
    background:rgba(14,148,136,.18);color:#fff;font-weight:600;
    border-left:2px solid var(--accent-2);
  }
  .nav-item .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;}

  .sidebar-foot{
    padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;gap:10px;
  }
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,#4C6EF5,#7048E8);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .sidebar-foot .who{line-height:1.2;}
  .sidebar-foot .who .n{color:#fff;font-size:12.5px;font-weight:600;}
  .sidebar-foot .who .r{color:#6C81A8;font-size:11px;}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .topbar .crumbs{font-size:11.5px;color:var(--text-faint);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px;}
  .topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;}
  .content{padding:24px 28px 48px 28px;flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:13px;font-weight:600;
    cursor:pointer;transition:all .12s;white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn:hover{background:#F8FAFC;border-color:#CBD5E1;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#0B7C72;border-color:#0B7C72;}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);border-color:#F3C7C1;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:#F1F5F9;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:7px;border:1px solid transparent;background:transparent;color:var(--text-soft);cursor:pointer;
  }
  .icon-btn:hover{background:#F1F5F9;color:var(--text);}
  .icon-btn svg{width:16px;height:16px;}

  /* ---------- Toolbar / Cards ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 18px;flex-wrap:wrap;
  }
  .toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .search-box{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--border);border-radius:8px;padding:7px 11px;background:#F8FAFC;min-width:230px;
  }
  .search-box svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
  .search-box input{border:none;background:none;outline:none;font-size:13px;width:100%;color:var(--text);}

  .filter-bar{
    display:none;padding:14px 18px;border-top:1px solid var(--border);
    background:#FAFBFD;gap:12px;flex-wrap:wrap;align-items:flex-end;
  }
  .filter-bar.open{display:flex;}
  .f-field{display:flex;flex-direction:column;gap:5px;min-width:150px;}
  .f-field label{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}

  select,input[type=text],input[type=date],input[type=email],input[type=tel],textarea{
    border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;
    font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .12s;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);}
  select{cursor:pointer;}

  /* ---------- Table ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:900px;}
  thead th{
    text-align:left;font-size:11.5px;color:var(--text-faint);font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#FAFBFD;
    white-space:nowrap;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tbody tr:hover{background:#F8FAFC;}
  tbody tr:last-child td{border-bottom:none;}
  .code-cell{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-soft);font-weight:600;}
  .name-cell{font-weight:600;}
  .cell-muted{color:var(--text-faint);}
  input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--accent);cursor:pointer;
  }
  .row-actions{display:flex;gap:4px;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
    font-size:11.5px;font-weight:700;white-space:nowrap;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .b-green{background:var(--success-soft);color:var(--success);}
  .b-gray{background:var(--gray-soft);color:var(--text-soft);}
  .b-amber{background:var(--warning-soft);color:var(--warning);}
  .b-red{background:var(--danger-soft);color:var(--danger);}
  .b-blue{background:var(--info-soft);color:var(--info);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-faint);}
  .empty-state svg{width:44px;height:44px;margin-bottom:12px;opacity:.5;}
  .empty-state .e-title{font-size:14px;font-weight:700;color:var(--text-soft);margin-bottom:4px;}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-faint);
    flex-wrap:wrap;gap:10px;
  }
  .pg-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .pg-size{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-faint);}
  .pg-size select{padding:5px 8px;font-size:12.5px;}
  .pg-nav{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);}
  .pg-nav .icon-btn{width:26px;height:26px;}
  .pg-nav .icon-btn svg{width:14px;height:14px;}
  .pg-indicator{min-width:70px;text-align:center;}

  /* ---------- Page header (list pages) ---------- */
  .page-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);
    display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 20px;overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:14px;width:100%;max-width:520px;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);animation:modalIn .16s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:16px;font-weight:700;}
  .modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--border);}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-soft);margin-bottom:6px;}
  .field label .req{color:var(--danger);margin-left:2px;}
  .field input,.field select,.field textarea{width:100%;}
  .field-hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#12203A;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:9px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:all .22s ease;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;color:var(--accent-2);flex-shrink:0;}

  #save-indicator{
    position:fixed;top:16px;right:22px;z-index:150;
    font-size:11.5px;font-weight:700;color:var(--text-faint);
    background:var(--surface);border:1px solid var(--border);border-radius:99px;
    padding:5px 12px;opacity:0;transform:translateY(-6px);
    transition:all .2s ease;box-shadow:var(--shadow);
  }
  #save-indicator.show{opacity:1;transform:translateY(0);}
  #save-indicator.is-error{color:var(--danger);border-color:#F3C7C1;}

  /* ---------- Detail / inner page ---------- */
  .detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--text-soft);font-size:13px;font-weight:600;
    cursor:pointer;margin-bottom:10px;
  }
  .back-link:hover{color:var(--text);}
  .back-link svg{width:15px;height:15px;}
  .detail-title-row{display:flex;align-items:center;gap:12px;}
  .detail-title-row h1{margin:0;}
  .detail-grid{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:flex-start;}
  @media (max-width:920px){.detail-grid{grid-template-columns:1fr;}}

  .tab-rail{display:flex;flex-direction:column;gap:3px;position:sticky;top:88px;}
  .tab-btn{
    display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:13px;font-weight:600;color:var(--text-soft);border-left:2px solid transparent;
  }
  .tab-btn:hover{background:#F1F5F9;}
  .tab-btn.active{background:var(--accent-soft);color:#0B7C72;border-left:2px solid var(--accent);}
  .tab-btn .n{
    width:20px;height:20px;border-radius:50%;background:#E7ECF3;color:var(--text-faint);
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .tab-btn.active .n{background:var(--accent);color:#fff;}

  .section-card{padding:24px 26px;margin-bottom:16px;}
  .section-card h3{margin:0 0 3px 0;font-size:15px;font-weight:700;}
  .section-card .sub{font-size:12.5px;color:var(--text-faint);margin-bottom:18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;}
  @media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
  .form-grid .full{grid-column:1/-1;}
  .ro-field{
    padding:9px 11px;background:#F8FAFC;border:1px dashed var(--border);border-radius:7px;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-soft);font-weight:600;
  }
  .view-value{padding:8px 0;font-size:13.5px;font-weight:600;color:var(--text);min-height:20px;}
  .view-value.empty{color:var(--text-faint);font-weight:400;font-style:normal;}

  .barcode-block{
    display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 20px;
    background:#FAFBFD;border:1px solid var(--border);border-radius:10px;
  }
  .barcode-block svg{max-width:100%;}
  .barcode-meta{font-size:12.5px;color:var(--text-faint);text-align:center;}

  /* ---------- CRUD simple pages (system mgmt) ---------- */
  .crud-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .tree-card{padding:18px 20px;margin-bottom:14px;}
  .tree-company{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .tree-company .name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .tree-company .name svg{width:17px;height:17px;color:var(--accent);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;
    background:#F1F5F9;border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-soft);
  }
  .chip button{
    width:18px;height:18px;border-radius:50%;border:none;background:#E2E8F0;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .chip button:hover{background:var(--danger-soft);color:var(--danger);}
  .chip button svg{width:10px;height:10px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:800px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{padding:16px 18px;}
  .stat-card .label{font-size:11.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .stat-card .val{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .stat-card .val small{font-size:13px;color:var(--text-faint);font-weight:600;margin-left:2px;}

  /* print view */
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;}
    .label-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;}
    .label-item{border:1px solid #999;border-radius:6px;padding:10px;text-align:center;break-inside:avoid;}
    .label-item .lname{font-size:11px;font-weight:700;margin-bottom:4px;}
    .label-item .lcode{font-size:10px;color:#444;margin-top:4px;font-family:'JetBrains Mono',monospace;}
  }

  .hidden{display:none !important;}
  .req-star{color:var(--danger);}
  .helper-note{
    display:flex;gap:8px;background:var(--info-soft);color:#1E4C9A;border-radius:8px;padding:10px 13px;font-size:12.5px;margin-bottom:16px;
  }
  .helper-note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}

  /* ---------- Login gate ---------- */
  .auth-gate{
    position:fixed;inset:0;z-index:500;
    background:linear-gradient(180deg,var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-card{
    width:100%;max-width:360px;background:var(--surface);border-radius:16px;
    padding:36px 32px;text-align:center;box-shadow:0 24px 60px -12px rgba(0,0,0,.45);
  }
  .auth-brand-mark{
    width:52px;height:52px;border-radius:14px;margin:0 auto 18px auto;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px -4px rgba(14,148,136,.55);
  }
  .auth-brand-mark svg{width:26px;height:26px;}
  .auth-card h2{margin:0 0 6px 0;font-size:18px;font-weight:800;}
  .auth-card p{margin:0 0 22px 0;font-size:13px;color:var(--text-faint);}
  .auth-card input{width:100%;text-align:center;font-size:15px;padding:11px 12px;margin-bottom:10px;}
  .auth-error{min-height:18px;color:var(--danger);font-size:12.5px;margin-bottom:10px;}
  .auth-submit{
    width:100%;padding:11px 14px;border-radius:8px;border:none;
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  }
  .auth-submit:hover{background:#0B7C72;}
</style>
</head>

   ========================================================================= */
const CODE128_BARS = [
  11011001100,11001101100,11001100110,10010011000,10010001100,10001001100,10011001000,10011000100,
  10001100100,11001001000,11001000100,11000100100,10110011100,10011011100,10011001110,10111001100,
  10011101100,10011100110,11001110010,11001011100,11001001110,11011100100,11001110100,11101101110,
  11101001100,11100101100,11100100110,11101100100,11100110100,11100110010,11011011000,11011000110,
  11000110110,10100011000,10001011000,10001000110,10110001000,10001101000,10001100010,11010001000,
  11000101000,11000100010,10110111000,10110001110,10001101110,10111011000,10111000110,10001110110,
  11101110110,11010001110,11000101110,11011101000,11011100010,11011101110,11101011000,11101000110,
  11100010110,11101101000,11101100010,11100011010,11101111010,11001000010,11110001010,10100110000,
  10100001100,10010110000,10010000110,10000101100,10000100110,10110010000,10110000100,10011010000,
  10011000010,10000110100,10000110010,11000010010,11001010000,11110111010,11000010100,10001111010,
  10100111100,10010111100,10010011110,10111100100,10011110100,10011110010,11110100100,11110010100,
  11110010010,11011011110,11011110110,11110110110,10101111000,10100011110,10001011110,10111101000,
  10111100010,11110101000,11110100010,10111011110,10111101110,11101011110,11110101110,11010000100,
  11010010000,11010011100,1100011101011
];
/** Encodes text (ASCII 32-126) as Code128 Subset B and draws it into an <svg>. */
function renderBarcodeSVG(svgEl, text, opts){
  opts = Object.assign({height:60, moduleWidth:2, margin:10, fontSize:13, displayValue:true, color:'#12203A'}, opts||{});
  if(!svgEl) return;
  const START_B = 104, STOP = 106;
  const values = [START_B];
  for(let i=0;i<text.length;i++){
    const code = text.charCodeAt(i);
    values.push(code>=32 && code<=126 ? code-32 : 0);
  }
  let checksum = values[0];
  for(let i=1;i<values.length;i++) checksum += values[i]*i;
  values.push(checksum % 103);
  values.push(STOP);

  let bin = '';
  values.forEach(v=>{ bin += CODE128_BARS[v].toString(); });

  const mw = opts.moduleWidth;
  const barHeight = opts.height;
  const textHeight = opts.displayValue ? opts.fontSize+8 : 0;
  const width = bin.length*mw + opts.margin*2;
  const height = barHeight + opts.margin*2 + textHeight;

  let rects = '';
  let x = opts.margin;
  for(let i=0;i<bin.length;i++){
    if(bin[i]==='1'){ rects += `<rect x="${x}" y="${opts.margin}" width="${mw}" height="${barHeight}" fill="${opts.color}"/>`; }
    x += mw;
  }
  const textEl = opts.displayValue
    ? `<text x="${width/2}" y="${opts.margin+barHeight+opts.fontSize+4}" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="${opts.fontSize}" fill="${opts.color}">${escHtml(text)}</text>`
    : '';
  svgEl.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svgEl.setAttribute('width', width);
  svgEl.setAttribute('height', height);
  svgEl.innerHTML = rects + textEl;
}

/* ---------- Pagination helpers (shared by every list view) ---------- */
function paginate(list){
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total/state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  if(state.page < 1) state.page = 1;
  const start = (state.page-1)*state.pageSize;
  return { items: list.slice(start, start+state.pageSize), total, totalPages };
}
function renderPaginationControls(total, totalPages){
  if(total===0) return '';
  return `
    <div class="pg-controls">
      <div class="pg-size">
        <label>每頁</label>
        <select onchange="setPageSize(this.value)">
          ${[10,25,50,100].map(n=>`<option value="${n}" ${state.pageSize==n?'selected':''}>${n}</option>`).join('')}
        </select>
        <span>筆</span>
      </div>
      <div class="pg-nav">
        <button class="icon-btn" ${state.page<=1?'disabled':''} onclick="setPage(${state.page-1})" title="上一頁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="pg-indicator">第 ${state.page} / ${totalPages} 頁</span>
        <button class="icon-btn" ${state.page>=totalPages?'disabled':''} onclick="setPage(${state.page+1})" title="下一頁">${ICONS.chev}</button>
      </div>
    </div>`;
}
function setPage(p){ state.page = p; rerenderContent(); }
function setPageSize(v){ state.pageSize = parseInt(v,10)||10; state.page = 1; rerenderContent(); }

function filteredAssets(){
  const f = state.filters;
  return db.assets.filter(a=>{
    if(f.q){
      const q = f.q.toLowerCase();
      if(!(a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q))) return false;
    }
    if(f.category && a.categoryId!==f.category) return false;
    if(f.status && a.status!==f.status) return false;
    if(f.custodian && a.custodianId!==f.custodian) return false;
    if(f.project && a.projectId!==f.project) return false;
    if(f.location && a.locationId!==f.location) return false;
    return true;
  });
}

/* ---------- CSV helpers (shared by asset + people import/export) ---------- */
function csvSafe(v){ v = (v??'').toString(); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function downloadCsv(rows, filename){
  const lines = rows.map(r=>r.map(csvSafe).join(','));
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
/** Minimal CSV parser that also handles quoted fields containing commas/newlines. */
function parseCsv(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field=''; rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
/** Looks up a reference entity by its display name for a CSV import column. Empty input is allowed (required-ness is checked separately). */
function findRefByColumn(col, rawValue){
  const v = (rawValue||'').trim();
  if(!v) return { id:'', matched:true };
  const found = col.ref().find(item => col.refLabel(item).trim().toLowerCase() === v.toLowerCase());
  return found ? { id:found.id, matched:true } : { id:'', matched:false };
}
/** Shows a modal listing every row that failed validation; nothing is imported until all rows pass. */
function showImportErrors(entityLabel, errors){
  const body = `
    <div class="helper-note" style="background:var(--danger-soft);color:var(--danger);">${ICONS.info}<span>共 ${errors.length} 筆資料有誤，本次尚未匯入任何資料，請修正 CSV 後再重新上傳。</span></div>
    <div style="max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;">
      ${errors.map(e=>`
        <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;">第 ${e.line} 列</div>
          <div style="font-size:12.5px;color:var(--text-soft);">${e.messages.map(m=>escHtml(m)).join('、')}</div>
        </div>`).join('')}
    </div>`;
  openModal({ title:`${entityLabel}匯入失敗`, body, saveLabel:'我知道了', onSave:()=>true });
}

/** Opens a modal first (template download + file picker) instead of jumping straight to the OS file dialog. */
function openImportModal(cfg){
  const body = `
    <div class="helper-note">${ICONS.info}<span>${cfg.hint || '請先下載範本，依格式填寫後再上傳。標示 * 為必填欄位。'}</span></div>

/* ---------- Asset export / template / import ---------- */
const ASSET_IMPORT_COLUMNS = [
  { key:'name',        label:'名稱',       required:true },
  { key:'category',    label:'分類',       required:true,  ref:()=>db.categories, refLabel:c=>categoryLabel(c.id) },
  { key:'brand',       label:'品牌',       required:false },
  { key:'model',       label:'型號',       required:false },
  { key:'serial',      label:'序號',       required:false },
  { key:'purchaseDate',label:'購買日期(YYYY-MM-DD)', required:true,  date:true },
  { key:'scrapDate',   label:'報廢日期(YYYY-MM-DD)', required:false, date:true },
  { key:'company',     label:'所屬公司',   required:true,  ref:()=>db.companies, refLabel:c=>c.name },
  { key:'department',  label:'部門',       required:false, ref:()=>db.departments, refLabel:d=>d.name },
  { key:'project',     label:'所屬專案',   required:true,  ref:()=>db.projects, refLabel:p=>p.name },
  { key:'custodian',   label:'保管人',     required:true,  ref:()=>db.people, refLabel:p=>p.name },
  { key:'location',    label:'地點',       required:false, ref:()=>db.locations, refLabel:l=>l.name },
  { key:'status',      label:'狀態',       required:false, choices:()=>Object.keys(STATUS_STYLE) },
  { key:'value',       label:'財產價值(NT$)', required:false, number:true },
];
function downloadAssetTemplate(){
  const headers = ASSET_IMPORT_COLUMNS.map(c=>c.label+(c.required?'*':''));
  const example = ['MacBook Pro 14"', categoryLabel(db.categories[1]?.id)||'電腦設備 / 筆記型電腦','Apple','MBP14-M3','C02XXXXXXX','2026-01-15','', companyName('c1')||'總公司', deptName('d1')||'資訊部', db.projects[0]?.name||'ERP系統導入', db.people[0]?.name||'陳志明', db.locations[0]?.name||'總部3樓辦公室','使用中','68900'];
  downloadCsv([headers, example], `資產匯入範本_${todayStr()}.csv`);
  showToast('已下載匯入範本');
}
function exportCsv(){
  const rows = filteredAssets();
  const headers = ['資產編號','名稱','分類','品牌','型號','序號','購買日期','報廢日期','所屬公司','部門','所屬專案','保管人','地點','狀態','財產價值'];
  const data = rows.map(a=>[
    a.code, a.name, categoryLabel(a.categoryId), a.brand, a.model, a.serial,
    a.purchaseDate||'', a.scrapDate||'', companyName(a.companyId), deptName(a.departmentId),
    projectName(a.projectId), personName(a.custodianId), locationName(a.locationId), a.status,
    a.value!==undefined && a.value!==null ? a.value : ''
  ]);
  downloadCsv([headers, ...data], `資產清單_${todayStr()}.csv`);
  showToast('已匯出 CSV 檔案');
}
function importCsv(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const rows = parseCsv(e.target.result);
    if(rows.length<2){ showToast('檔案內沒有可匯入的資料', true); return; }
    const errors = [], toInsert = [];
    rows.slice(1).forEach((cols, idx)=>{
      const lineNo = idx+2, rowErrors = [], rec = {};
      ASSET_IMPORT_COLUMNS.forEach((col,ci)=>{
        const raw = (cols[ci]||'').trim();
        if(col.required && !raw){ rowErrors.push(`「${col.label}」未填寫`); return; }
        if(col.ref){
          const { id, matched } = findRefByColumn(col, raw);
          if(raw && !matched) rowErrors.push(`「${col.label}」找不到符合的資料：${raw}`);
          rec[col.key] = id;
        } else if(col.choices){
          if(raw && !col.choices().includes(raw)) rowErrors.push(`「${col.label}」值不正確：${raw}`);
          rec[col.key] = raw || '閒置';
        } else if(col.date){
          if(raw && !/^\d{4}-\d{2}-\d{2}$/.test(raw)) rowErrors.push(`「${col.label}」格式需為 YYYY-MM-DD`);
          rec[col.key] = raw;
        } else if(col.number){
          if(raw && (Number.isNaN(Number(raw)) || Number(raw) < 0)) rowErrors.push(`「${col.label}」需為 0 或正數`);
          rec[col.key] = raw ? Number(raw) : '';
        } else {
          rec[col.key] = raw;
        }
      });
      if(rowErrors.length) errors.push({ line:lineNo, messages:rowErrors });
      else toInsert.push(rec);
    });

    if(errors.length){ showImportErrors('資產', errors); return; }

    toInsert.forEach(rec=>{
      db.assets.push({
        id: uid('a'), code:`AST${String(seq.asset++).padStart(5,'0')}`,
        name: rec.name, categoryId: rec.category, brand: rec.brand, model: rec.model, serial: rec.serial,
        purchaseDate: rec.purchaseDate, scrapDate: rec.scrapDate, companyId: rec.company,
        departmentId: rec.department, projectId: rec.project, custodianId: rec.custodian,
        locationId: rec.location, status: rec.status || '閒置', value: rec.value,
      });
    });
    state.page = 1;
    rerenderContent();
    showToast(`已成功匯入 ${toInsert.length} 筆資產`);
  };
  reader.readAsText(file, 'UTF-8');
}

let draftAsset = null; // working copy while editing

    purchaseDate:'', scrapDate:'', companyId:'c1', departmentId:'', projectId:'', custodianId:'', locationId:'', status:'閒置', value:'' };
  renderApp();
}
function backToList(){ state.view='asset-list'; renderApp(); }
function switchToEditFromView(){ state.detailMode='edit'; draftAsset={...byId(db.assets,state.detailAssetId)}; rerenderContent(); }
function cancelEdit(){
  if(state.detailMode==='new'){ backToList(); return; }
  state.detailMode='view'; draftAsset=null; rerenderContent();
}

function setAssetTab(tab){ state.assetTab = tab; rerenderContent(); }

function updateDraft(key,val){ draftAsset[key]=val; }

function saveAsset(){
  if(!draftAsset.name || !draftAsset.name.trim()){ showToast('請填寫資產名稱', true); setAssetTab('basic'); return; }
  if(!draftAsset.categoryId){ showToast('請選擇資產分類', true); setAssetTab('basic'); return; }
  if(!draftAsset.purchaseDate){ showToast('請填寫購買日期', true); setAssetTab('purchase'); return; }
  if(!draftAsset.companyId){ showToast('請選擇所屬公司', true); setAssetTab('owner'); return; }
  if(!draftAsset.projectId){ showToast('請選擇所屬專案', true); setAssetTab('owner'); return; }
  if(!draftAsset.custodianId){ showToast('請選擇保管人', true); setAssetTab('owner'); return; }

  if(state.detailMode==='new'){
    const newAsset = {...draftAsset, id: uid('a'), code:`AST${String(seq.asset++).padStart(5,'0')}`};
    db.assets.push(newAsset);
    state.detailAssetId = newAsset.id;
    showToast('資產已新增');
  } else {
    const idx = db.assets.findIndex(a=>a.id===draftAsset.id);
    const original = db.assets[idx];
    const custodianChanged = original.custodianId !== draftAsset.custodianId;
    const locationChanged = original.locationId !== draftAsset.locationId;
    const departmentChanged = original.departmentId !== draftAsset.departmentId;
    const companyChanged = original.companyId !== draftAsset.companyId;
    const projectChanged = original.projectId !== draftAsset.projectId;
    db.assets[idx] = {...draftAsset};
    if(custodianChanged || locationChanged || departmentChanged || companyChanged || projectChanged){
      addTransferRecord({
        assetId: draftAsset.id,
        fromCustodianId: original.custodianId, toCustodianId: draftAsset.custodianId,
        fromLocationId: original.locationId, toLocationId: draftAsset.locationId,
        fromDepartmentId: original.departmentId, toDepartmentId: draftAsset.departmentId,
        fromCompanyId: original.companyId, toCompanyId: draftAsset.companyId,
        fromProjectId: original.projectId, toProjectId: draftAsset.projectId,
        date: todayISODate(), reason:'透過資產內頁修改自動產生', source:'auto',
      });
      showToast('資產已儲存，並自動新增一筆移轉紀錄');
    } else {
      showToast('資產已儲存');
    }
  }
  state.detailMode='view'; draftAsset=null;
  rerenderContent();
}

function deleteAsset(id){
  confirmDialog('刪除資產', '確定要刪除這筆資產嗎？此操作無法復原。', ()=>{
    db.assets = db.assets.filter(a=>a.id!==id);
    closeModal();
    showToast('資產已刪除');
    backToList();
  });

function renderAssetDetail(){
  const mode = state.detailMode;
  const a = mode==='view' ? byId(db.assets,state.detailAssetId) : draftAsset;
  if(!a){ return renderEmptyState(); }
  const editable = mode!=='view';

  return `
  <div class="back-link" onclick="backToList()">${ICONS.arrowLeft}<span>返回資產清單</span></div>
  <div class="detail-head">
    <div class="detail-title-row">
      <h1>${mode==='new' ? '新增資產' : escHtml(a.name || '未命名資產')}</h1>
      ${mode!=='new' ? statusBadge(a.status) : ''}
    </div>
    <div class="page-actions">
      ${mode==='view' ? `
        <button class="btn btn-danger" onclick="deleteAsset('${a.id}')">${ICONS.trash}<span>刪除</span></button>
        <button class="btn btn-primary" onclick="switchToEditFromView()">${ICONS.edit}<span>修改</span></button>

        <button class="btn btn-primary" onclick="saveAsset()">${ICONS.check}<span>儲存</span></button>

function renderAssetTabContent(a, editable, mode){
  if(state.assetTab==='basic') return sectionBasic(a, editable, mode);
  if(state.assetTab==='spec') return sectionSpec(a, editable);
  if(state.assetTab==='purchase') return sectionPurchase(a, editable);
  if(state.assetTab==='owner') return sectionOwner(a, editable);
  if(state.assetTab==='barcode') return sectionBarcode(a);
  return '';
}

function formatCurrency(v){
  if(v===undefined || v===null || v==='') return '';
  const n = Number(v);
  if(Number.isNaN(n)) return '';
  return 'NT$ ' + n.toLocaleString('zh-Hant-TW');
}

const PEOPLE_IMPORT_COLUMNS = [
  { key:'name',       label:'姓名',     required:true },
  { key:'company',    label:'所屬公司', required:true,  ref:()=>db.companies, refLabel:c=>c.name },
  { key:'department', label:'部門',     required:false, ref:()=>db.departments, refLabel:d=>d.name },
  { key:'email',      label:'Email',    required:false },
  { key:'phone',      label:'電話',     required:false },
  { key:'status',     label:'狀態',     required:false, choices:()=>['在職','離職'] },
];
function downloadPeopleTemplate(){
  const headers = PEOPLE_IMPORT_COLUMNS.map(c=>c.label+(c.required?'*':''));
  const example = ['陳志明', companyName('c1')||'總公司', deptName('d1')||'資訊部', 'name@example.com', '0912-345-678', '在職'];
  downloadCsv([headers, example], `人員匯入範本_${todayStr()}.csv`);
  showToast('已下載匯入範本');
}
function importPeopleCsv(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const rows = parseCsv(e.target.result);
    if(rows.length<2){ showToast('檔案內沒有可匯入的資料', true); return; }
    const errors = [], toInsert = [];
    rows.slice(1).forEach((cols, idx)=>{
      const lineNo = idx+2, rowErrors = [], rec = {};
      PEOPLE_IMPORT_COLUMNS.forEach((col,ci)=>{
        const raw = (cols[ci]||'').trim();
        if(col.required && !raw){ rowErrors.push(`「${col.label}」未填寫`); return; }
        if(col.ref){
          const { id, matched } = findRefByColumn(col, raw);
          if(raw && !matched) rowErrors.push(`「${col.label}」找不到符合的資料：${raw}`);
          rec[col.key] = id;
        } else if(col.choices){
          if(raw && !col.choices().includes(raw)) rowErrors.push(`「${col.label}」值不正確：${raw}`);
          rec[col.key] = raw || '在職';
        } else {
          rec[col.key] = raw;
        }
      });
      if(rowErrors.length) errors.push({ line:lineNo, messages:rowErrors });
      else toInsert.push(rec);
    });

    if(errors.length){ showImportErrors('人員', errors); return; }

    toInsert.forEach(rec=>{
      db.people.push({
        id: uid('p'), name: rec.name, companyId: rec.company, departmentId: rec.department,
        email: rec.email, phone: rec.phone, status: rec.status || '在職',
      });
    });
    state.page = 1;
    rerenderContent();
    showToast(`已成功匯入 ${toInsert.length} 筆人員`);
  };
  reader.readAsText(file, 'UTF-8');
}

/* =========================================================================
   系統管理：資產分類管理（先顯示大分類，點擊分類名稱才進入下一層）
   ========================================================================= */
function renderCategoriesPage(){
  const parentId = state.categoryParentId;
  const levelItems = db.categories.filter(c => (c.parentId||null) === (parentId||null));
  const { items, total, totalPages } = paginate(levelItems);
  return `
  <div class="helper-note">${ICONS.info}<span>先顯示大分類，點擊分類名稱可進入下一層查看或建立子分類。</span></div>
  <div class="crud-header">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;">${buildCategoryBreadcrumb(parentId)}</div>
    <button class="btn btn-primary" onclick="openCategoryModal(null,'${parentId||''}')">${ICONS.plus}<span>${parentId ? '新增子分類' : '新增分類'}</span></button>
  </div>
  <div class="panel">
    <div class="table-wrap">
      ${items.length===0 ? renderEmptyState() : `
      <table>
        <thead><tr><th>分類名稱</th><th>子分類數</th><th style="width:110px;">功能</th></tr></thead>
        <tbody>
          ${items.map(c=>{
            const childCount = db.categories.filter(x=>x.parentId===c.id).length;
            return `
            <tr>
              <td><span class="name-cell" style="cursor:pointer;color:var(--accent);" onclick="enterCategory('${c.id}')">${escHtml(c.name)}</span></td>
              <td class="cell-muted">${childCount ? `${childCount} 項` : '—'}</td>
              <td>
                <div class="row-actions">
                  <button class="icon-btn" title="編輯" onclick="openCategoryModal('${c.id}')">${ICONS.edit}</button>
                  <button class="icon-btn" title="刪除" onclick="deleteCategory('${c.id}')">${ICONS.trash}</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="table-footer">
      <span>共 ${total} 項</span>
      ${renderPaginationControls(total, totalPages)}
    </div>
  </div>`;
}
function buildCategoryBreadcrumb(parentId){
  const chain = [];
  let cur = parentId ? byId(db.categories, parentId) : null;
  while(cur){ chain.unshift(cur); cur = cur.parentId ? byId(db.categories, cur.parentId) : null; }
  let html = `<span style="cursor:pointer;font-weight:700;${!parentId?'color:var(--text);':'color:var(--accent);'}" onclick="enterCategory(null)">全部分類</span>`;
  chain.forEach((c,i)=>{
    const isLast = i===chain.length-1;
    html += `<span class="cell-muted">/</span><span style="cursor:pointer;font-weight:700;${isLast?'color:var(--text);':'color:var(--accent);'}" onclick="enterCategory('${c.id}')">${escHtml(c.name)}</span>`;
  });
  return html;
}
function enterCategory(id){ state.categoryParentId = id; state.page = 1; rerenderContent(); }
function openCategoryModal(id, parentIdForNew){
  const c = id ? byId(db.categories, id) : null;
  openModal({
    title: c ? '編輯分類' : '新增分類',
    body: `<div class="field"><label>分類名稱 <span class="req">*</span></label><input id="m-cat-name" type="text" value="${escAttr(c?.name||'')}"></div>`,
    onSave: ()=>{
      const name = document.getElementById('m-cat-name').value.trim();
      if(!name){ showToast('請輸入分類名稱', true); return false; }
      if(c){ c.name = name; }
      else { db.categories.push({ id:uid('cat'), name, parentId: parentIdForNew || null }); }
      rerenderContent();
      showToast(c ? '分類已更新' : '分類已新增');
      return true;
    }
  });
}
function deleteCategory(id){
  confirmDialog('刪除分類', '刪除此分類將一併刪除其所有子分類，確定要繼續嗎？', ()=>{
    const toDelete = new Set([id]);
    let changed = true;
    while(changed){
      changed = false;
      db.categories.forEach(c=>{ if(c.parentId && toDelete.has(c.parentId) && !toDelete.has(c.id)){ toDelete.add(c.id); changed = true; } });
    }
    db.categories = db.categories.filter(c=>!toDelete.has(c.id));
    closeModal();
    if(toDelete.has(state.categoryParentId)) state.categoryParentId = null;
    state.page = 1;
    rerenderContent();
    showToast('分類已刪除');
  });
}

/* =========================================================================
   資產管理：資產移轉紀錄
   不可修改、不可刪除的稽核紀錄。新增方式有兩種：
   1) 在此頁手動新增（保管人／地點）
   2) 在資產內頁「修改」時，只要保管人／地點／部門有變動，儲存時系統自動補一筆
   ========================================================================= */
function todayISODate(){ const d=new Date(); return d.toISOString().slice(0,10); }

/** Shared writer for both manual and system-generated transfer records. */
function addTransferRecord({ assetId, fromCustodianId, toCustodianId, fromLocationId, toLocationId, fromDepartmentId, toDepartmentId, fromCompanyId, toCompanyId, fromProjectId, toProjectId, date, reason, source }){
  db.transfers.unshift({
    id: uid('t'), assetId,
    fromCustodianId: fromCustodianId||'', toCustodianId: toCustodianId||'',
    fromLocationId: fromLocationId||'', toLocationId: toLocationId||'',
    fromDepartmentId: fromDepartmentId||'', toDepartmentId: toDepartmentId||'',
    fromCompanyId: fromCompanyId||'', toCompanyId: toCompanyId||'',
    fromProjectId: fromProjectId||'', toProjectId: toProjectId||'',
    date: date || todayISODate(), reason: reason||'', source: source||'manual',
  });
}

  const { items, total, totalPages } = paginate(db.transfers);
  return `

    <div class="table-wrap">
      ${items.length===0 ? renderEmptyState() : `
      <table>
        <thead><tr>
          <th>日期</th><th>資產</th><th>轉出人</th><th>保管人</th><th>公司變更</th><th>部門變更</th><th>專案變更</th><th>地點變更</th><th>原因</th><th>來源</th>
        </tr></thead>

            return `
            <tr>
              <td class="cell-muted">${t.date||'—'}</td>
              <td>
                <div class="name-cell">${asset ? escHtml(asset.name) : '（資產已刪除）'}</div>
                <div class="code-cell">${asset ? asset.code : ''}</div>
              </td>
              <td>${personName(t.fromCustodianId)||'—'}</td>
              <td>${personName(t.toCustodianId)||'—'}</td>
              <td class="cell-muted">${companyChanged ? `${companyName(t.fromCompanyId)||'未指定'} → ${companyName(t.toCompanyId)||'未指定'}` : '未變更'}</td>
              <td class="cell-muted">${deptChanged ? `${deptName(t.fromDepartmentId)||'未指定'} → ${deptName(t.toDepartmentId)||'未指定'}` : '未變更'}</td>
              <td class="cell-muted">${projectChanged ? `${projectName(t.fromProjectId)||'未指定'} → ${projectName(t.toProjectId)||'未指定'}` : '未變更'}</td>
              <td class="cell-muted">${locChanged ? `${locationName(t.fromLocationId)||'未指定'} → ${locationName(t.toLocationId)||'未指定'}` : '未變更'}</td>
              <td class="cell-muted">${t.reason ? escHtml(t.reason) : '—'}</td>
              <td>${t.source==='auto' ? `<span class="badge b-blue"><span class="dot"></span>系統自動</span>` : `<span class="badge b-gray"><span class="dot"></span>手動新增</span>`}</td>
            </tr>`;
          }).join('')}

function openCrudModal(key, id){
  const cfg = CFG_MAP[key];
  const row = id ? byId(db[key], id) : null;
  const bodyHtml = cfg.fields.map(f=>{
    const val = row ? row[f.key] : (f.default!==undefined ? f.default : '');
    if(f.type==='select'){
      const opts = typeof f.options==='function' ? f.options(id) : f.options;
      return `<div class="field">
        <label>${f.label}${f.required?' <span class="req">*</span>':''}</label>
        <select id="m-f-${f.key}">
          <option value="">${f.allowEmpty || '請選擇'}</option>
          ${opts.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${o.label}</option>`).join('')}
        </select>
      </div>`;
    }
    return `<div class="field">
      <label>${f.label}${f.required?' <span class="req">*</span>':''}</label>
      <input id="m-f-${f.key}" type="${f.type}" value="${escAttr(val||'')}">
    </div>`;
  }).join('');

  openModal({
    title: row ? `編輯${cfg.title.replace('管理','')}` : cfg.addLabel,
    body: bodyHtml,
    onSave: ()=>{
      const data = {};
      for(const f of cfg.fields){
        const v = document.getElementById(`m-f-${f.key}`).value;
        if(f.required && !v.trim()){ showToast(`請填寫${f.label}`, true); return false; }
        data[f.key] = v;
      }
      if(row){ Object.assign(row, data); }
      else { db[key].push({id:uid(key[0]), ...data}); }
      rerenderContent();
      showToast(row ? '已更新' : '已新增');
      return true;
    }
  });
}

    db[key] = db[key].filter(r=>r.id!==id);

  });
}

/* =========================================================================
   MODAL / TOAST / CONFIRM helpers
   ========================================================================= */
function openModal({title, body, onSave, saveLabel}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay show" id="modal-overlay" onmousedown="if(event.target.id==='modal-overlay')closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          <button class="btn" onclick="closeModal()">取消</button>

        </div>
      </div>
    </div>`;
  document.getElementById('modal-save-btn').onclick = ()=>{ const ok = onSave(); if(ok!==false) closeModal(); };
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function confirmDialog(title, msg, onConfirm){
  openModal({
    title, body:`<p style="margin:0;font-size:13.5px;color:var(--text-soft);line-height:1.6;">${msg}</p>`,
    saveLabel:'確定刪除',
    onSave: ()=>{ onConfirm(); return false; }
  });
  // recolor confirm button to danger
  const btn = document.getElementById('modal-save-btn');
  if(btn){ btn.style.background='var(--danger)'; btn.style.borderColor='var(--danger)'; }
}

let toastTimer=null;
function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.innerHTML = `${isError ? ICONS.x : ICONS.check}<span>${msg}</span>`;
  t.style.color = '#fff';
  const icon = t.querySelector('svg'); if(icon) icon.style.color = isError ? '#F87171' : 'var(--accent-2)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================================
   UTIL
   ========================================================================= */
function escHtml(s){ return (s??'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return escHtml(s); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

/* =========================================================================
   PERSISTENCE — auto-save to a shared Firestore document so a refresh
   (or anyone else opening the same URL) doesn't lose data. This file is
   self-hosted, so it uses a real backend (Firebase) instead of the
   Claude-artifact-only window.storage API.
   NOTE: everyone who opens this page reads/writes the same document —
   by design for a shared, multi-user asset system.
   ========================================================================= */
let saveTimer = null;
let saveIndicatorTimer = null;

function persistData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await fbDocRef.set({
        payload: JSON.stringify({ db, seq }),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      flashSaveIndicator('已儲存');
    }catch(e){
      console.error('Firestore save failed', e);
      flashSaveIndicator('儲存失敗，變更僅保留在此分頁', true);
    }
  }, 450);
}

function flashSaveIndicator(msg, isError){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = msg;
  el.classList.toggle('is-error', !!isError);
  el.classList.add('show');
  clearTimeout(saveIndicatorTimer);
  saveIndicatorTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}

async function loadData(){
  try{
    const snap = await fbDocRef.get();
    if(snap.exists && snap.data().payload){
      const parsed = JSON.parse(snap.data().payload);
      if(parsed.db){
        Object.keys(db).forEach(k=>{ db[k] = parsed.db[k] !== undefined ? parsed.db[k] : db[k]; });
      }
      if(parsed.seq){ Object.assign(seq, parsed.seq); }
    } else {
      seedAssets();
    }
  }catch(e){
    console.error('Firestore load failed, using sample data', e);
    if(db.assets.length===0) seedAssets();
  }
  renderApp();
}

/* =========================================================================
   AUTH — shared-password login gate, backed by Firebase Authentication.
   Firestore rules require request.auth != null, so without signing in here
   the database itself is unreadable — this isn't just a UI-level lock.
   ========================================================================= */
const SHARED_LOGIN_EMAIL = 'team@liyao-111e7.local'; // must match the user created in Firebase Console > Authentication

function submitPassword(){
  const pwd = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!pwd){ errEl.textContent = '請輸入密碼'; return; }
  firebase.auth().signInWithEmailAndPassword(SHARED_LOGIN_EMAIL, pwd)
    .catch(()=>{ errEl.textContent = '密碼錯誤，請再試一次'; });
}

function logout(){
  firebase.auth().signOut();
}

firebase.auth().onAuthStateChanged((user)=>{
  const gate = document.getElementById('auth-gate');
  if(user){
    gate.style.display = 'none';
    loadData();
  } else {
    gate.style.display = 'flex';
    document.getElementById('app').innerHTML = '';
  }
});
</script>
